<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <style>
      .t{font-size:14px;fill:#0f172a;} .s{font-size:12px;fill:#475569;}
      .title{font-size:19px;font-weight:700;fill:#0f172a;}
      .cap{font-size:12.5px;fill:#475569;}
      .lbl{font-size:12px;font-weight:700;fill:#b45309;}
    </style>
  </defs>
  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" class="title">Поделба на текстот на делови што се преклопуваат</text>

  <!-- full document bar -->
  <rect x="60" y="76" width="1080" height="46" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="600" y="104" text-anchor="middle" class="s">Документ — долг непрекинат текст</text>
  <!-- faint boundary guides -->
  <line x1="420" y1="122" x2="420" y2="150" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3 4"/>
  <line x1="700" y1="122" x2="700" y2="150" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3 4"/>
  <line x1="980" y1="122" x2="980" y2="150" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3 4"/>

  <!-- chunks -->
  <!-- chunk1 60..420 -->
  <rect x="60" y="176" width="360" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="240" y="201" text-anchor="middle" class="t">Дел 1</text>
  <!-- chunk2 340..700, overlap 340..420 -->
  <rect x="340" y="232" width="360" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="340" y="232" width="80" height="40" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="520" y="257" text-anchor="middle" class="t">Дел 2</text>
  <!-- chunk3 620..980, overlap 620..700 -->
  <rect x="620" y="288" width="360" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="620" y="288" width="80" height="40" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="800" y="313" text-anchor="middle" class="t">Дел 3</text>
  <!-- chunk4 900..1140, overlap 900..980 -->
  <rect x="900" y="344" width="240" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="900" y="344" width="80" height="40" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="1020" y="369" text-anchor="middle" class="t">Дел 4</text>

  <!-- overlap brace/label between chunk1 and chunk2 -->
  <path d="M340 224 L340 218 L420 218 L420 224" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <text x="380" y="212" text-anchor="middle" class="lbl">преклоп</text>

  <!-- legend -->
  <rect x="60" y="416" width="18" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="86" y="428" class="s">дел (chunk)</text>
  <rect x="200" y="416" width="18" height="14" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="226" y="428" class="s">заеднички (преклопен) текст</text>

  <text x="600" y="462" text-anchor="middle" class="cap">Секој дел го дели крајот со почетокот на следниот, па контекстот на реченицата не се губи на границите меѓу деловите.</text>
</svg>
