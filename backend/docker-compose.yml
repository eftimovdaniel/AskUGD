# Lokalna baza za testiranje:
#   docker compose up -d          -> startuva Qdrant na http://127.0.0.1:6333
#   docker compose --profile redis up -d
#   docker compose down           -> zapira (podatocite ostanuvaat vo volume)
#   docker compose down -v        -> zapira + BRISHE sè
# Qdrant/Redis se vrzani samo na localhost — ne na LAN/internet.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    profiles: ["redis"]
    restart: unless-stopped

volumes:
  qdrant_data:
