# Lokalna baza za testiranje / prod-like:
#   docker compose up -d          -> Qdrant :6333 + Redis :6379
#   docker compose down           -> zapira (podatocite ostanuvaat vo volume)
#   docker compose down -v        -> zapira + BRISHE sè
# Qdrant/Redis se vrzani samo na localhost — ne na LAN/internet.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
