# Render Blueprint — backend API za AskUGD
# Deploy: Render Dashboard → New → Blueprint → izberi go ovoj repo
# Root: backend/  ILI  stavi go render.yaml vo root na repo (vidi DEPLOY-RENDER.md)

services:
  - type: web
    name: askugd-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: AskUGD
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_MAX_CALLS_PER_HOUR
        value: "100"
      - key: LLM_MAX_CALLS_PER_DAY
        value: "500"
